
[package]
name = "video-processor"
version = "0.1.0"
edition = "2021" # recommended unless you truly need 2024

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.100"
js-sys = "0.3.77"
web-sys = { version = "0.3.77", features = ["HtmlVideoElement"] }

image = { version = "0.24.9", default-features = false, features = ["png"] }
console_error_panic_hook = "0.1.7"

